name: Terraform Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Finn Terraform-katalog (m/ main.tf)
        shell: pwsh
        run: |
          $repo = "${{ github.workspace }}"
          $hits = Get-ChildItem -Path $repo -Recurse -Filter 'main.tf' -ErrorAction SilentlyContinue |
                  Select-Object -ExpandProperty DirectoryName -Unique
          if (!$hits) { throw "Fant ingen main.tf i repoet." }
          if ($hits.Count -gt 1) {
            Write-Host "Flere Terraform-kataloger funnet:"
            $hits | ForEach-Object { Write-Host " - $_" }
            $tfDir = $hits[0]
            Write-Host "Bruker første treff: $tfDir"
          } else {
            $tfDir = $hits[0]
          }
          "TF_DIR=$tfDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "TF_DIR=$tfDir"

      - name: Terraform Init
        shell: pwsh
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Terraform Validate
        shell: pwsh
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform Plan
        shell: pwsh
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -no-color
